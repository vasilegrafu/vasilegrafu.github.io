<text x="197.2" y="133" font-family="Geist" font-size="11" font-weight="400" fill="#5E6779" text-anchor="start">the rules of an order, no I/O</text>
<text x="76" y="155" font-family="Geist Mono" font-size="12" font-weight="400" fill="#1B2130" text-anchor="start">order.py</text>
<text x="76" y="177" font-family="Geist Mono" font-size="12" font-weight="400" fill="#1B2130" text-anchor="start">pricing.py</text>
<text x="54" y="199" font-family="Geist Mono" font-size="12" font-weight="600" fill="#111A2E" text-anchor="start">store/</text>
<text x="197.2" y="199" font-family="Geist" font-size="11" font-weight="400" fill="#5E6779" text-anchor="start">Postgres and Redis, behind two small interfaces</text>
