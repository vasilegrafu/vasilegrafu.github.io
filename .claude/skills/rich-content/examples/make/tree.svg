<text x="32" y="45" font-family="Geist Mono" font-size="12" font-weight="600" fill="#111A2E" text-anchor="start">src/</text>
<text x="197.2" y="45" font-family="Geist" font-size="11" font-weight="400" fill="#5E6779" text-anchor="start">the service itself</text>
<text x="54" y="67" font-family="Geist Mono" font-size="12" font-weight="600" fill="#111A2E" text-anchor="start">api/</text>
<text x="197.2" y="67" font-family="Geist" font-size="11" font-weight="400" fill="#5E6779" text-anchor="start">HTTP endpoints, one file per resource</text>
<text x="76" y="89" font-family="Geist Mono" font-size="12" font-weight="400" fill="#1B2130" text-anchor="start">orders.py</text>
<text x="76" y="111" font-family="Geist Mono" font-size="12" font-weight="400" fill="#1B2130" text-anchor="start">health.py</text>
