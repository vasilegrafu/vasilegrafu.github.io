<text x="355" y="47.19" font-family="Geist" font-size="13" font-weight="600" fill="#1B2130" text-anchor="start">Must it survive a restart?</text>
<text x="133" y="177.19" font-family="Geist" font-size="13" font-weight="600" fill="#1B2130" text-anchor="start">Is it read on every request?</text>
<text x="22" y="299.94" font-family="Geist" font-size="13" font-weight="600" fill="#1B2130" text-anchor="start">In-process cache</text>
<text x="22" y="315.44" font-family="Geist" font-size="10.5" font-weight="400" fill="#5E6779" text-anchor="start">per instance</text>
<text x="244" y="307.19" font-family="Geist" font-size="13" font-weight="600" fill="#1B2130" text-anchor="start">Leave it in memory</text>
<text x="577" y="177.19" font-family="Geist" font-size="13" font-weight="600" fill="#1B2130" text-anchor="start">Is it a fact others query?</text>
<text x="466" y="299.94" font-family="Geist" font-size="13" font-weight="600" fill="#1B2130" text-anchor="start">Postgres</text>
<text x="466" y="315.44" font-family="Geist" font-size="10.5" font-weight="400" fill="#5E6779" text-anchor="start">a table, with its rules</text>
<text x="688" y="299.94" font-family="Geist" font-size="13" font-weight="600" fill="#1B2130" text-anchor="start">Redis</text>
<text x="688" y="315.44" font-family="Geist" font-size="10.5" font-weight="400" fill="#5E6779" text-anchor="start">with a TTL</text>
