<rect x="619.99" y="492" width="39.5" height="14" rx="3" fill="var(--dg-surface, #ffffff)"/>
<text x="639.74" y="503" font-family="Geist Mono" font-size="10.5" font-weight="500" fill="var(--dg-ink, #1f1d1a)" text-anchor="middle">ready</text>
<text x="639.74" y="525" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="var(--dg-text, #5e5850)" text-anchor="middle" font-style="italic">is anything still open?</text>
<rect x="146.3" y="542" width="251.17" height="14" rx="3" fill="var(--dg-surface, #ffffff)"/>
<text x="271.88" y="553" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--dg-ink, #1f1d1a)" text-anchor="middle">One question is open: how long are invoices kept?</text>
<rect x="230.37" y="578" width="115.03" height="14" rx="3" fill="var(--dg-surface, #ffffff)"/>
<text x="287.88" y="589" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--dg-text, #5e5850)" text-anchor="middle">Seven years. Agree it.</text>
