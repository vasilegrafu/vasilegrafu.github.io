<rect x="111" y="108" width="353.76" height="14" rx="3" fill="var(--dg-surface, #ffffff)"/>
<text x="287.88" y="119" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--dg-ink, #1f1d1a)" text-anchor="middle">Use specs-builder. Customers should download their invoices as PDFs.</text>
<rect x="163.49" y="144" width="216.78" height="14" rx="3" fill="var(--dg-surface, #ffffff)"/>
<text x="271.88" y="155" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--dg-ink, #1f1d1a)" text-anchor="middle">Who signs in? Who may see which invoice?</text>
<text x="271.88" y="177" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="var(--dg-text, #5e5850)" text-anchor="middle" font-style="italic">only what it cannot know</text>
<rect x="189.99" y="194" width="195.79" height="14" rx="3" fill="var(--dg-surface, #ffffff)"/>
<text x="287.88" y="205" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--dg-text, #5e5850)" text-anchor="middle">Customers see their own; staff see all.</text>
<rect x="518.76" y="230" width="241.97" height="14" rx="3" fill="var(--dg-surface, #ffffff)"/>
<text x="639.74" y="241" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--dg-ink, #1f1d1a)" text-anchor="middle">six requirements, each with its reason and tests</text>
