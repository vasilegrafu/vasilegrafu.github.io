<text x="271.88" y="361" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--dg-ink, #1f1d1a)" text-anchor="middle">Which design system, brand, theme?</text>
<rect x="230.66" y="386" width="114.44" height="14" rx="3" fill="var(--dg-surface, #ffffff)"/>
<text x="287.88" y="397" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="var(--dg-text, #5e5850)" text-anchor="middle">Our brand, blue; light.</text>
<rect x="526.11" y="422" width="227.26" height="14" rx="3" fill="var(--dg-surface, #ffffff)"/>
